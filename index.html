<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف الأداء الوظيفي — ناهد علي عطار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap">
<style>
:root{--bg:#f7f3fc;--tx:#2a1d45;--mut:#6f648a;--p0:#3d1468;--p1:#4f1d84;--p2:#6a2fa8;--p3:#9b7bd0;--p4:#ece3f8;--p5:#f5effc;--bd:#e3d8f2;--ok:#1f8a4c;--wait:#a86a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Geeza Pro","GeezaPro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.6}
.w{max-width:1080px;margin:0 auto;padding:14px 14px 30px}
.hero{position:relative;overflow:hidden;border-radius:22px;min-height:240px;padding:26px 30px;color:#fff;background:linear-gradient(115deg,#4b1677 0%,#5a1f86 45%,#3a1262 100%)}
.hero .wave{position:absolute;inset:auto 0 0 0;height:90px;width:100%}
.hero .deco{position:absolute;left:18px;top:14px;width:min(40%,380px);height:auto}
.hero .txt{position:relative;z-index:1;max-width:62%}
.hero .logos{display:block;height:52px;width:auto;margin-bottom:10px}
.hero h1{margin:0;font-size:2.3rem;font-weight:700;line-height:1.35}
.hero .uline{display:block;width:190px;height:12px;margin:-2px 0 4px}
.hero .t2{font-size:1.35rem;font-weight:700;opacity:.95}.hero .t3{opacity:.85}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:10px 16px;margin:14px 0 6px}
.nav .brand{font-weight:700;font-size:1.25rem;color:var(--p0);padding-inline-end:16px;border-inline-end:2px solid var(--p4)}
.nav .tabs{display:flex;gap:6px;flex:1}
.nav .tabs a{cursor:pointer;text-decoration:none;font-weight:600;color:var(--tx);padding:7px 20px;border-radius:12px}
.nav .tabs a.on{background:var(--p4);color:var(--p1)}
.nav .yr{display:flex;align-items:center;gap:6px;background:var(--p4);color:var(--p1);font-weight:700;border-radius:12px;padding:6px 14px}
.nav .yr svg{width:18px;height:18px}
.shead{text-align:center;margin:22px 0 14px}
.shead h2{display:flex;align-items:center;justify-content:center;gap:18px;margin:0;font-size:1.75rem}
.shead h2:before,.shead h2:after{content:"";flex:0 1 180px;height:2px;background:linear-gradient(90deg,var(--p3),transparent)}
.shead h2:after{background:linear-gradient(90deg,transparent,var(--p3))}
.shead p{margin:2px 0 0;color:var(--mut);font-weight:600}
.search{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto 18px;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:4px 14px}
.search:focus-within{border-color:var(--p2)}
.search input{flex:1;border:0;outline:0;font:inherit;padding:8px 0;background:transparent}.search svg{width:22px;height:22px;color:var(--p0)}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.card{position:relative;width:calc((100% - 32px)/3);background:#fff;border:1.5px solid var(--bd);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 4px 16px rgba(79,29,132,.06);transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(79,29,132,.14);border-color:var(--p3)}
.card .no{position:absolute;right:12px;top:12px;min-width:28px;height:28px;border-radius:9px;background:var(--p4);color:var(--p0);font-weight:700;display:grid;place-items:center}
.card .wt{position:absolute;left:12px;top:12px;background:var(--p4);color:var(--p0);font-weight:700;border-radius:9px;padding:1px 9px;font-size:.92rem}
.ic{flex:none;width:74px;height:62px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#f3ecfc,#e6dbf6);color:var(--p0)}
.ic svg{width:40px;height:40px}
.card h3{margin:0;font-size:1.1rem;line-height:1.45;min-height:3em;display:flex;align-items:center}
.card .btn{width:100%;font:inherit;font-weight:700;color:var(--p0);background:linear-gradient(180deg,#e7dcf7,#dccdf2);border:0;border-radius:11px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.card .btn svg{width:18px;height:18px}.card .btn small{font-weight:600;color:var(--mut)}
.panel{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:14px}
.back{font:inherit;font-weight:700;border:0;background:var(--p4);color:var(--p1);padding:7px 16px;border-radius:12px;cursor:pointer}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.drive{font-weight:700;color:var(--p2);text-decoration:none}
.eh{display:flex;gap:14px;align-items:center}.eh h2{margin:0;font-size:1.45rem;line-height:1.4}.eh .wt{display:inline-block;background:var(--p4);color:var(--p0);font-weight:700;border-radius:9px;padding:2px 10px;font-size:.95rem}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.box{background:var(--p5);border:1px solid var(--bd);border-radius:16px;padding:12px 16px}
.box h4{margin:0 0 6px;color:var(--p1)}.box ul{margin:0;padding-inline-start:20px}.box li{margin:2px 0}
.stitle{margin:18px 0 10px;color:var(--p1);font-size:1.15rem}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;text-decoration:none;color:inherit;background:#fff;cursor:pointer}
.file:hover{border-color:var(--p3);background:#fbf8ff}
.file .nm{flex:1;font-weight:600}.file .dt{color:var(--mut);font-size:.8rem;white-space:nowrap}.path{font-size:.78rem;color:var(--mut);font-weight:400}
.new{background:var(--p2);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px}
.chip{flex:none;font-size:.72rem;font-weight:700;border-radius:8px;padding:2px 8px;min-width:46px;text-align:center}
.c-pdf{background:#fde8e8;color:#b42318}.c-doc{background:#e6efff;color:#1d4ed8}.c-sheet{background:#e4f5ea;color:#1f7a45}.c-slide{background:#fff1dc;color:#b45309}.c-img{background:#f3e8ff;color:#7e22ce}.c-vid{background:#ffe4f1;color:#be185d}.c-oth{background:#eef0f4;color:#4b5563}
details.fold{border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:#fcfaff}
details.fold summary{cursor:pointer;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.fold-body{padding:0 12px 6px}
.st{white-space:nowrap;font-weight:700;border-radius:999px;padding:1px 10px;font-size:.8rem}.st.ok{background:#e4f5ea;color:var(--ok)}.st.wait{background:#fdf3e1;color:var(--wait)}
.wait-txt{color:var(--wait);background:#fdf6ea;border-radius:12px;padding:12px;text-align:center;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.links a{text-decoration:none;font-weight:700;color:var(--p1);background:var(--p4);border:1.5px solid var(--p3);border-radius:12px;padding:8px 14px}
.banner{max-width:640px;margin:0 auto 14px;background:#fff6e6;border:1px solid #f3d9a4;color:#7a4b00;border-radius:14px;padding:8px 14px;font-size:.9rem;text-align:center}
.about{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.about div{background:var(--p5);border:1px solid var(--bd);border-radius:14px;padding:12px 16px}.about b{display:block;color:var(--p1);font-size:.9rem}
.sig{display:flex;align-items:center;gap:18px;margin:30px 0 4px}
.sig:before,.sig:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--p3),transparent)}.sig:after{background:linear-gradient(90deg,transparent,var(--p3))}
.sig div{text-align:center}.sig .ar{font-family:"Aref Ruqaa",serif;font-size:2rem;color:var(--p0);line-height:1.1}.sig .en{letter-spacing:.35em;font-size:.85rem;font-weight:600;direction:ltr}
.upd{text-align:center;color:var(--mut);font-size:.82rem}.upd button{font:inherit;margin-inline-start:8px;border:1.5px solid var(--p3);background:#fff;color:var(--p1);border-radius:10px;padding:2px 12px;cursor:pointer}
#pv{position:fixed;inset:0;background:rgba(30,10,50,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}#pv.on{display:flex}
.pv-box{background:#fff;border-radius:20px;width:min(1000px,100%);height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden}
.pv-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.pv-h .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-h a,.pv-h button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:6px 12px;cursor:pointer;text-decoration:none}
.pv-h a{background:var(--p4);color:var(--p1)}.pv-h button{background:var(--p1);color:#fff}
#pv-body{flex:1}#pv-body iframe{width:100%;height:100%;border:0}
.pv-demo{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);padding:20px}
@media(max-width:860px){.card{width:calc((100% - 16px)/2)}.hero .deco{opacity:.22;width:75%}.hero .txt{max-width:100%}}
@media(max-width:560px){.grid{gap:10px}.card{width:calc((100% - 10px)/2);padding:38px 8px 10px}.card h3{font-size:.92rem;min-height:4.3em}.card .btn{font-size:.85rem;padding:6px 4px;gap:4px}.card .btn svg{width:15px;height:15px}.ic{width:56px;height:48px}.ic svg{width:30px;height:30px}.card .no{right:8px;top:8px}.card .wt{left:8px;top:8px;font-size:.8rem}.hero{padding:20px}.hero h1{font-size:1.7rem}.hero .t2{font-size:1.1rem}.boxes,.about{grid-template-columns:1fr}.nav{justify-content:center}.nav .brand{border:0;padding:0;width:100%;text-align:center}.nav .tabs{flex:none}.nav .tabs a{padding:6px 12px}.shead h2{font-size:1.35rem}.shead h2:before,.shead h2:after{flex-basis:40px}}
</style>
</head>

 growth:'<path d="M4 28h24"/><rect x="6" y="19" width="4" height="9" rx="1"/><rect x="13" y="14" width="4" height="14" rx="1"/><rect x="20" y="9" width="4" height="19" rx="1"/><path d="M5 14 13 7l4 3 9-7M21 3h5v5"/>',
 cal:'<rect x="4" y="6" width="24" height="22" rx="3"/><path d="M4 12h24M10 3v6M22 3v6M11 20l3.5 3.5L21 17"/>',
 laptop:'<rect x="6" y="7" width="20" height="14" rx="2"/><path d="M2.5 25h27l-2 3h-23z"/>',
 room:'<rect x="5" y="4" width="22" height="13" rx="1.5"/><path d="M13 17v3M19 17v3M4 22h10M18 22h10M6 22v6M12 22v6M20 22v6M26 22v6"/>',
 class:'<rect x="13" y="3" width="17" height="11" rx="1.5"/><circle cx="7" cy="8" r="2.8"/><path d="M3 18c0-3 1.8-5 4-5l5 2"/><circle cx="12" cy="21" r="2.3"/><circle cx="19" cy="21" r="2.3"/><circle cx="26" cy="21" r="2.3"/><path d="M8 29c0-2.5 1.8-4.3 4-4.3s4 1.8 4 4.3M15 29c0-2.5 1.8-4.3 4-4.3s4 1.8 4 4.3M22 29c0-2.5 1.8-4.3 4-4.3s4 1.8 4 4.3"/>',
 analyze:'<path d="M5 3h14l5 5v12"/><path d="M19 3v5h5"/><path d="M5 3v26h11"/><path d="M9 21v-4M13 21v-7M17 21v-5"/><circle cx="22" cy="23" r="4.5"/><path d="M25.3 26.3 29 30"/>',
 check:'<rect x="6" y="5" width="20" height="24" rx="3"/><rect x="11" y="3" width="10" height="5" rx="1.5"/><path d="M10 14l2 2 3-3M18 15h5M10 21l2 2 3-3M18 22h5"/>'
};
const ico=k=>`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const EN=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const clean=n=>{const c=String(n).replace(/^[\s\d٠-٩]+[-–.)\s]+/,'').trim();return c||n};
const norm=s=>clean(String(s)).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
const fid=l=>{if(!l)return'';const m=l.match(/folders\/([\w-]+)/)||l.match(/[?&]id=([\w-]+)/);return m?m[1]:(/^[\w-]{15,}$/.test(l)?l:'')};
const EL=CONFIG.elements.map((e,i)=>({...e,k:'e'+(i+1),n:i+1}));
let ROOT=null,UPDATED=null,MODE='demo',ERR='';

function countFiles(n){return n?n.files.length+n.folders.reduce((a,f)=>a+countFiles(f),0):0}
function allFiles(n,path=[]){let r=n.files.map(f=>({...f,path}));n.folders.forEach(f=>r=r.concat(allFiles(f,path.concat(clean(f.name)))));return r}
function findEl(e){if(!ROOT)return null;
  return ROOT.folders.find(f=>{const m=EN(f.name).match(/^\s*(\d+)/);return m&&+m[1]===e.n})||ROOT.folders.find(f=>norm(f.name).includes(norm(e.t)))||null}
function chip(t,name){t=t||'';const e=(name.split('.').pop()||'').toLowerCase();
  if(t.includes('pdf')||e==='pdf')return'<span class="chip c-pdf">PDF</span>';
  if(t.includes('spreadsheet')||t.includes('excel')||/^(xlsx?|csv)$/.test(e))return'<span class="chip c-sheet">جدول</span>';
  if(t.includes('presentation')||t.includes('powerpoint')||/^pptx?$/.test(e))return'<span class="chip c-slide">عرض</span>';
  if(t.includes('document')||t.includes('word')||/^docx?$/.test(e))return'<span class="chip c-doc">مستند</span>';
  if(t.startsWith('image')||/^(png|jpe?g|heic|webp)$/.test(e))return'<span class="chip c-img">صورة</span>';
  if(t.startsWith('video')||/^(mp4|mov)$/.test(e))return'<span class="chip c-vid">فيديو</span>';
  return'<span class="chip c-oth">ملف</span>'}
let HF;try{HF=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long'})}catch(e){HF=null}
const fmt=d=>{if(!d)return'';try{return HF?HF.format(new Date(d)):new Date(d).toLocaleDateString('ar')}catch(e){return''}};
const isNew=d=>d&&(Date.now()-new Date(d))<7*864e5;
const fileRow=(f,showPath)=>`<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener" data-name="${esc(f.name)}" onclick="pv(event,this)">${chip(f.type,f.name)}<span class="nm">${esc(f.name.replace(/\.[a-z0-9]{2,5}$/i,''))}${showPath&&f.path.length?`<div class="path">${esc(f.path.join(' ‹ '))}</div>`:''}</span>${isNew(f.date)?'<span class="new">جديد</span>':''}<span class="dt">${fmt(f.date)}</span></a>`;
function renderBody(node,depth){
  if(!node.files.length&&!node.folders.length)return'<div class="wait-txt">⏳ قيد الاستكمال</div>';
  return node.files.map(f=>fileRow(f)).join('')+node.folders.map(f=>{const c=countFiles(f);return`<details class="fold" ${depth<1?'open':''}><summary>${esc(clean(f.name))}<span class="st ${c?'ok':'wait'}">${c?AR(c)+' ملف':'قيد الاستكمال'}</span></summary><div class="fold-body">${renderBody(f,depth+1)}</div></details>`}).join('')}

function home(){
  let h='<div class="shead"><h2>عناصر الأداء الوظيفي</h2><p>شواهد وممارسات توثّق رحلتي المهنية</p></div>';
  h+='<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input placeholder="ابحثي عن عنصر أو شاهد" oninput="search(this.value)"></label>';
  if(MODE==='demo')h+='<div class="banner">عرض تجريبي — تظهر الشواهد الحقيقية تلقائيًا بعد ربط مجلد الدرايف.</div>';
  if(ERR)h+=`<div class="banner">${esc(ERR)}</div>`;
  h+='<div id="res"></div><div class="grid" id="grid">'+EL.map(e=>{const c=countFiles(findEl(e));
    return`<div class="card" data-s="${esc(norm(e.t+' '+e.ex.join(' ')+' '+e.ev.join(' ')))}"><span class="no">${AR(e.n)}</span><span class="wt">${e.w}%</span><div class="ic">${ico(e.i)}</div><h3>${esc(e.t)}</h3><button class="btn" onclick="go('${e.k}')">${EXT} عرض الشواهد ${c?`<small>(${AR(c)})</small>`:''}</button></div>`}).join('')+'</div>';
  app.innerHTML=h}

function elView(e){
  const node=findEl(e);
  let h=`<div class="panel"><div class="ptop"><button class="back" onclick="go('')">→ الرئيسية</button>${node&&node.url&&node.url!=='#'?`<a class="drive" href="${esc(node.url)}" target="_blank" rel="noopener">فتح المجلد في Drive ↗</a>`:''}</div>
   <div class="eh"><div class="ic">${ico(e.i)}</div><div><h2>${AR(e.n)}. ${esc(e.t)}</h2><span class="wt">الوزن النسبي ${e.w}%</span></div></div>
   <div class="boxes"><div class="box"><h4>أمثلة على تحقق العنصر</h4><ul>${e.ex.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="box"><h4>الشواهد المقترحة</h4><ul>${e.ev.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
   <h3 class="stitle">الشواهد المرفوعة ${node?`(${AR(countFiles(node))})`:''}</h3>${node?renderBody(node,0):'<div class="wait-txt">⏳ قيد الاستكمال</div>'}`;
  if(e.links)h+='<div class="links">'+e.links.map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join('')+'</div>';
  app.innerHTML=h+'</div>'}

function allView(){
  const list=ROOT?allFiles(ROOT).sort((a,b)=>(b.date||'').localeCompare(a.date||'')):[];
  app.innerHTML=`<div class="panel"><div class="ptop"><button class="back" onclick="go('')">→ الرئيسية</button></div><h2 style="margin:0">جميع الشواهد</h2><p style="color:var(--mut);margin:4px 0 12px">مرتبة من الأحدث · ${AR(list.length)} شاهد</p>
   <label class="search" style="margin:0 0 14px;max-width:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input placeholder="ابحثي باسم الشاهد أو العنصر" oninput="filt(this.value)"></label>
   <div id="al">${list.length?list.map(f=>fileRow(f,true)).join(''):'<div class="wait-txt">⏳ قيد الاستكمال</div>'}</div></div>`}
function filt(q){q=norm(q||'');document.querySelectorAll('#al .file').forEach(a=>a.style.display=!q||norm(a.textContent).includes(q)?'':'none')}

function aboutView(){
  app.innerHTML=`<div class="panel"><div class="ptop"><button class="back" onclick="go('')">→ الرئيسية</button></div><h2 style="margin:0 0 12px">عني</h2>
   <div class="about"><div><b>الاسم</b>${esc(CONFIG.teacher)}</div><div><b>الوظيفة</b>${esc(CONFIG.job)}</div><div><b>المدرسة</b>${esc(CONFIG.school)}</div><div><b>الصفوف التي أدرّسها</b>${esc(CONFIG.classes)}</div><div><b>مديرة المدرسة</b>${esc(CONFIG.principal)}</div><div><b>العام الدراسي</b>${esc(CONFIG.year)}</div></div>
   <div class="links"><a href="https://nahidattar2.github.io/11/links.html" target="_blank" rel="noopener">اختباراتي الإلكترونية ↗</a><a href="https://nahidattar2.github.io/11/tadreeb.html" target="_blank" rel="noopener">مساحة الرياضيات ↗</a><a href="https://nahidattar2.github.io/qudrat/links.html" target="_blank" rel="noopener">اختبارات القدرات الكمي ↗</a></div></div>`}

function search(q){q=norm(q||'');const box=document.getElementById('res');
  document.querySelectorAll('#grid .card').forEach(c=>c.style.display=!q||c.dataset.s.includes(q)?'':'none');
  if(q.length<2||!ROOT){box.innerHTML='';return}
  const r=allFiles(ROOT).filter(f=>norm(f.name).includes(q)).slice(0,40);
  box.innerHTML=r.length?`<div class="panel" style="margin:0 0 16px">${r.map(f=>fileRow(f,true)).join('')}</div>`:''}

function previewUrl(u){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);if(!m)return'';
  if(/docs\.google\.com\/(document|spreadsheets|presentation)/.test(u))return u.replace(/\/(edit|view|htmlview)[^]*$/,'')+'/preview';
  return'https://drive.google.com/file/d/'+m[1]+'/preview'}
function pv(ev,a){const u=a.getAttribute('href');const p=u&&u!=='#'?previewUrl(u):'';if(u&&u!=='#'&&!p)return;ev.preventDefault();
  document.getElementById('pv-name').textContent=a.dataset.name;document.getElementById('pv-chip').innerHTML=a.querySelector('.chip').outerHTML;
  const o=document.getElementById('pv-open');o.href=u;o.style.display=p?'':'none';
  document.getElementById('pv-body').innerHTML=p?`<iframe src="${p}" allow="autoplay" allowfullscreen></iframe>`:'<div class="pv-demo"><div><div style="font-size:42px">📄</div>هنا يظهر الشاهد نفسه كما يعرضه Google Drive<br><small>(عرض تجريبي)</small></div></div>';
  document.getElementById('pv').classList.add('on');document.body.style.overflow='hidden'}
function pvClose(){document.getElementById('pv').classList.remove('on');document.getElementById('pv-body').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')pvClose()});

function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;window.scrollTo({top:0,behavior:'smooth'})}
function route(){const h=location.hash.slice(1),e=EL.find(x=>x.k===h);
  document.querySelectorAll('.nav .tabs a').forEach(a=>a.classList.toggle('on',a.dataset.k===(e?'':h)));
  if(e)elView(e);else if(h==='all')allView();else if(h==='about')aboutView();else home()}
window.addEventListener('hashchange',route);

async function load(fresh){
  const id=fid(CONFIG.folder);
  if(CONFIG.scriptUrl&&id){
    if(!ROOT)app.innerHTML='<div class="panel" style="text-align:center;color:#6f648a">جارٍ تحميل أحدث الشواهد من الدرايف…</div>';
    try{const r=await fetch(CONFIG.scriptUrl+'?action=tree&folder='+id+(fresh?'&fresh=1':''));const j=await r.json();
      if(!j.ok)throw new Error(j.error);ROOT=j.tree;UPDATED=j.updated;MODE='live';ERR=''}
    catch(e){ERR='تعذّر الاتصال بالدرايف الآن، حاولي التحديث بعد قليل.';if(!ROOT){ROOT=demo();MODE='demo'}}
  }else{ROOT=demo();MODE='demo'}
  document.getElementById('upd').innerHTML=UPDATED?`آخر تحديث: ${new Date(UPDATED).toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})}<button onclick="load(true)">تحديث الآن</button>`:'';
  route()}

function demo(){let id=0;const D=n=>new Date(Date.now()-n*864e5).toISOString();
  const f=(name,days,type)=>({name,url:'#',type:type||'application/pdf',date:D(days)});
  const F=(name,files=[],folders=[])=>({id:'d'+(++id),name,url:'#',files,folders});
  const ex=[[f('سجل الدوام الرسمي',20)],[f('شهادة حضور مجتمع تعلم',12,'image/jpeg')],[],[f('تقرير تطبيق استراتيجية التعلم التعاوني',5)],
    [f('الخطة العلاجية — الفصل الثالث',3,'application/vnd.google-apps.document')],[f('خطة توزيع المنهج',40)],[f('تقرير الاختبارات الإلكترونية',2)],[],[],[f('تحليل نتائج الاختبار التشخيصي',30,'application/vnd.google-apps.spreadsheet')],[]];
  return F('ملف الأداء الوظيفي ١٤٤٨هـ',[],EL.map((e,i)=>F(AR(i+1)+'- '+e.t,ex[i])))}

document.getElementById('t2').textContent=CONFIG.job+' '+CONFIG.teacher;
document.getElementById('t3').textContent=CONFIG.school;
document.getElementById('yr').textContent=CONFIG.year;
load();
</script>
</body>
